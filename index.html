<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101522"><title>Companion RPG — Prototype</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eef3ff;background:#101522}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:20px 16px 50px}h1{margin:0;font-size:1.7rem}p{color:#bdc7d9;line-height:1.45}.eyebrow{color:#9cc9ff;letter-spacing:.12em;text-transform:uppercase;font-size:.7rem}.panel{background:#1b2436;border:1px solid #34425c;border-radius:18px;padding:18px;margin-top:16px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{font:inherit;color:#fff;background:#314566;border:1px solid #57749b;border-radius:12px;padding:12px 8px;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4}button:focus-visible{outline:3px solid #8bd5ff}.cards button{min-height:136px;display:flex;flex-direction:column;justify-content:center;gap:8px}.emoji{font-size:2.7rem}.small{font-size:.75rem;color:#c3d0e8}.primary{background:#3d72b6}.stats{display:flex;justify-content:space-between;gap:8px}.meter{height:10px;border-radius:20px;background:#3d465b;overflow:hidden;margin:9px 0}.meter>div{height:100%;background:#66c995;transition:width .2s}.enemy .meter>div{background:#f08d81}.moves{display:grid;grid-template-columns:1fr 1fr;gap:9px}.log{min-height:70px;color:#e0e9fa}.hidden{display:none}.tag{font-size:.75rem;color:#9db6d6}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}footer{margin-top:24px;color:#8394ae;font-size:.8rem}
</style></head><body><main><div class="eyebrow">Original creature RPG · early prototype</div><h1>Companions</h1><p>Choose a starter and test our first turn-based battle. This is a mechanics prototype, not final game artwork.</p>
<section id="choose" class="panel"><h2>Choose your companion</h2><div class="cards" id="starters"></div></section>
<section id="battle" class="hidden"><div class="panel enemy"><div class="row"><strong id="enemyName"></strong><span id="enemyHpText"></span></div><div class="meter"><div id="enemyBar"></div></div><div class="emoji" style="text-align:center" id="enemyIcon"></div></div><div class="panel"><div class="emoji" id="heroIcon"></div><div class="row"><strong id="heroName"></strong><span id="heroHpText"></span></div><div class="meter"><div id="heroBar"></div></div><div class="row"><span class="tag" id="heroStats"></span><span class="tag" id="wins"></span></div></div><div class="panel"><div id="log" class="log" role="status" aria-live="polite"></div><div id="moves" class="moves"></div><button id="again" class="primary hidden" style="width:100%;margin-top:12px">Next encounter</button></div></section>
<footer>Prototype v0.1 · Progress is stored on this device. Creature visuals are placeholders.</footer></main>
<script>
'use strict';
const species=[
{id:'lumi',name:'Lumi',icon:'🐒',role:'Adaptable',hp:42,atk:11,def:9,spd:11,moves:[['Quick Swipe',10,95],['Tail Whip',13,80],['Focus Strike',16,65],['Safe Jab',8,100]]},
{id:'bront',name:'Bront',icon:'🦏',role:'Defensive',hp:56,atk:10,def:14,spd:6,moves:[['Horn Jab',11,95],['Shell Bash',15,75],['Heavy Charge',19,55],['Steady Hit',8,100]]},
{id:'skaryx',name:'Skaryx',icon:'🦗',role:'Fast attacker',hp:32,atk:16,def:6,spd:16,moves:[['Scythe Cut',12,90],['Razor Rush',15,75],['Predator Lunge',21,50],['Precise Slice',9,100]]}
];
const $=id=>document.getElementById(id);let hero,enemy,locked=false,finished=false,wins=0;
const storage='companion-rpg-v01';try{const saved=JSON.parse(localStorage.getItem(storage));if(saved&&Number.isInteger(saved.wins))wins=Math.max(0,saved.wins)}catch{}
function save(){try{localStorage.setItem(storage,JSON.stringify({starter:hero?.id,wins}))}catch{}}
function clone(s){return {...s,current:s.hp}}
function update(){for(const [who,bar,txt] of [[hero,'heroBar','heroHpText'],[enemy,'enemyBar','enemyHpText']]){if(!who)continue;$(bar).style.width=(100*who.current/who.hp)+'%';$(txt).textContent=who.current+'/'+who.hp+' HP'}$('wins').textContent='Wins: '+wins;$('heroStats').textContent='ATK '+hero.atk+' · DEF '+hero.def+' · SPD '+hero.spd}
function start(id){hero=clone(species.find(s=>s.id===id));$('choose').classList.add('hidden');$('battle').classList.remove('hidden');$('heroName').textContent=hero.name;$('heroIcon').textContent=hero.icon;$('heroStats').textContent=hero.role;encounter();save()}
function encounter(){enemy=clone(species.filter(s=>s.id!==hero.id)[Math.floor(Math.random()*2)]);hero.current=hero.hp;finished=false;locked=false;$('enemyName').textContent='Wild '+enemy.name;$('enemyIcon').textContent=enemy.icon;$('again').classList.add('hidden');$('moves').classList.remove('hidden');$('log').textContent='A wild '+enemy.name+' approaches!';$('moves').replaceChildren();hero.moves.forEach(([name,power,accuracy],i)=>{const b=document.createElement('button');b.textContent=name+' ('+accuracy+'%)';b.onclick=()=>turn(i);$('moves').append(b)});update()}
function strike(a,d,m){const [name,power,accuracy]=m;if(Math.random()*100>=accuracy)return a.name+' missed '+name+'!';const variance=.85+Math.random()*.3;const damage=Math.max(1,Math.round((power+a.atk*.8-d.def*.48)*variance));d.current=Math.max(0,d.current-damage);return a.name+' used '+name+' for '+damage+' damage.'}
function finish(text){finished=true;locked=false;$('log').textContent=text;$('moves').classList.add('hidden');$('again').classList.remove('hidden');$('again').textContent=hero.current>0?'Next encounter':'Try again';if(hero.current>0){wins++;save()}update()}
function turn(index){if(locked||finished)return;locked=true;const move=hero.moves[index],counter=enemy.moves[Math.floor(Math.random()*enemy.moves.length)];let messages=[];const order=hero.spd>=enemy.spd?[[hero,enemy,move],[enemy,hero,counter]]:[[enemy,hero,counter],[hero,enemy,move]];for(const [a,d,m] of order){if(a.current<=0||d.current<=0)break;messages.push(strike(a,d,m));if(d.current<=0)break}update();if(enemy.current<=0)return finish(messages.join(' ')+' Victory!');if(hero.current<=0)return finish(messages.join(' ')+' Your companion fainted.');$('log').textContent=messages.join(' ');locked=false}
species.forEach(s=>{const b=document.createElement('button');b.innerHTML='<span class="emoji">'+s.icon+'</span><strong>'+s.name+'</strong><span class="small">'+s.role+'</span>';b.onclick=()=>start(s.id);$('starters').append(b)});
$('again').onclick=encounter;
</script></body></html>
